---
DOCUMENTATION:
  name: hosting_edge_captured
  short_description: List the existing hostnames that new wildcards would capture
  author: Richard Lynch (@Richard-Lynch)
  description:
    - Returns every hostname in I(hosts) that falls under any of the wildcards, sorted and de-duplicated.
    - Wildcard entries in I(hosts) are rules, not names, and are skipped. A non-empty result means publishing
      the wildcards would change how a live name is routed or authenticated.
  options:
    _input:
      description: The new wildcards.
      type: list
      required: true
    hosts:
      description: The hostnames that exist today.
      type: list
      required: true
EXAMPLES: |
  - name: Refuse a wildcard that would capture a live name
    ansible.builtin.assert:
      that:
        - (['*.dev.example.com'] | richard_lynch.network.hosting_edge_captured(existing_hosts)) == []
RETURN:
  _value:
    description: The captured hostnames, sorted.
    type: list
