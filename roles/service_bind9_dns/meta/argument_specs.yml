argument_specs:
  main:
    short_description: Authoritative bind9 DNS (optionally forwarding) + record task interface
    version_added: '1.0'
    author: Collection maintainers
    options:
      ddns_tsig_key_secret:
        description: TSIG key for Kea DDNS (openssl rand -base64 32). From vault.
        type: str
        required: true
      bind9_image:
        type: str
        required: false
      bind9_forward_ip:
        description: Upstream resolver this bind9 forwards to when recursion is on (forward-only).
        type: str
        required: false
      bind9_forward_port:
        type: int
        required: false
        default: 5053
      bind9_forwarders:
        description: Explicit forwarders, each '<ip>' or '<ip> port <n>'. Non-empty replaces bind9_forward_ip/bind9_forward_port. Used when recursion stays on but Pi-hole is in front of bind9 (forwarding to it would loop).
        type: list
        required: false
        default: []
        elements: str
      bind9_primary_domain:
        description: The zone this server is authoritative for, e.g. example.com.
        type: str
        required: true
      bind9_ns_fqdn:
        description: NS/SOA nameserver name, with the trailing dot. Defaults to `dns.<bind9_primary_domain>.`, the `dns` record every new zone is seeded with.
        type: str
        required: false
      bind9_soa_contact:
        description: SOA RNAME, with the trailing dot. Defaults to `hostmaster.<bind9_primary_domain>.`.
        type: str
        required: false
      bind9_ns_ip:
        description: Address of the `dns` A record a NEW zone file is seeded with, when the caller does not pass bind9_dns_ip. Required the first time a zone is created.
        type: str
        required: false
      bind9_allow_transfer:
        description: 'BIND address-match list allowed to AXFR, `;`-terminated. Default: nobody.'
        type: str
        required: false
        default: none;
      bind9_recursion:
        description: 'Whether named recurses (forward-only to bind9_forward_ip) or is authoritative-only (recursion no). Leave false when another resolver (e.g. Pi-hole) sits in front: clients query it directly and bind9 only answers for the zones it is authoritative for.'
        type: bool
        required: false
        default: false
      bind9_dns_service_port:
        description: Port bind9 publishes on the host (both tcp+udp).
        type: int
        required: false
        default: 53
      bind9_dns_service_bind_ip:
        description: Host IP bind9's port publish binds to. Empty/undefined publishes on all addresses. Set it to one host address (e.g. a management address) when another DNS server on the same host owns the service address's :53.
        type: str
        required: false
      bind9_zones_owner_uid:
        description: UID that must own the host-side zones directory so DDNS updates can be written. The ubuntu/bind9 image runs `named -u bind`, and `bind` is UID 100 in that image's /etc/passwd (the standard Debian/Ubuntu allocation). Without this, the host directory (root:root, mode 0755 by default) has no write bit for uid 100, named cannot create the .jnl journal a dynamic update requires, and every DDNS UPDATE fails SERVFAIL even though TSIG and the zone's allow-update are both correct.
        type: int
        required: false
        default: 100
      bind9_zones_owner_gid:
        description: GID paired with bind9_zones_owner_uid (bind's primary group, gid 101).
        type: int
        required: false
        default: 101
