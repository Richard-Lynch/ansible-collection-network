---
# A host registers an A record in a zone. Idempotent, present/absent.
# Requires: bind9_parent_domain (the zone, e.g. lan.vlans.example.com), bind9_sub_domain (the label,
# e.g. host01), bind9_ip. Optional: bind9_state (present|absent, default present).

- name: "Add_host — zone must exist first"
  ansible.builtin.stat:
    path: "{{ bind9_config_dir }}/zones/{{ bind9_parent_domain }}.zone"
  register: _zone

- name: "Add_host — fail if the zone is missing"
  ansible.builtin.fail:
    msg: "Zone '{{ bind9_parent_domain }}' not found — create it with add_domain/add_vlan first."
  when: not _zone.stat.exists

- name: "Add_host — is the zone static or dynamic"
  ansible.builtin.include_tasks: _record_zone_kind.yml

# A DYNAMIC (Kea-served, journaled) zone is not written: see _dynamic_skip.yml. A present record
# there is checked read-only instead.
- name: "Add_host — dynamic zone: not written, checked read-only"
  ansible.builtin.include_tasks: _dynamic_skip.yml
  vars:
    _ds_type: A
    _ds_fqdn: "{{ bind9_sub_domain }}.{{ bind9_parent_domain }}"
    _ds_value: "{{ bind9_ip }}"
  when:
    - _rz_dynamic | bool
    - not (bind9_record_infra_exception | default(false) | bool)

# The INFRASTRUCTURE EXCEPTION (bind9_record_infra_exception): a name in a dynamic zone that can
# never lease is reconciled over RFC 2136 against what bind9 serves (_dynamic_record.yml), never by
# editing the journaled file.
- name: "Add_host — dynamic zone, infrastructure exception: reconcile over RFC 2136"
  ansible.builtin.include_tasks: _dynamic_record.yml
  vars:
    _dr_type: A
    _dr_fqdn: "{{ bind9_sub_domain }}.{{ bind9_parent_domain }}"
    _dr_value: "{{ bind9_ip }}"
  when:
    - _rz_dynamic | bool
    - bind9_record_infra_exception | default(false) | bool

- name: "Add_host — {{ bind9_state | default('present') }} A {{ bind9_sub_domain }}.{{ bind9_parent_domain }}"
  when: not (_rz_dynamic | bool)
  ansible.builtin.blockinfile:
    path: "{{ bind9_config_dir }}/zones/{{ bind9_parent_domain }}.zone"
    marker: "; {mark} ANSIBLE MANAGED A: {{ bind9_sub_domain }}.{{ bind9_parent_domain }}"
    block: "{{ bind9_sub_domain }}\t\tIN\t\tA\t\t{{ bind9_ip }}"
    state: "{{ bind9_state | default('present') }}"
    mode: "0644"
    create: false
  notify: Restart bind9
