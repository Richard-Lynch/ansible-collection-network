# Assert the rendered files are what Headscale and traefik will parse — read as DATA, not grepped.
---
- name: Verify rendered Headscale + traefik config
  hosts: localhost
  gather_facts: false
  vars:
    _render_dir: /tmp/molecule-headscale-render
  tasks:
    - name: Read the rendered files
      ansible.builtin.slurp:
        src: "{{ _render_dir }}/{{ item }}"
      loop: [config.yaml, policy.json, docker-compose.yml, traefik.yml, dynamic.yml]
      register: _files

    - name: Parse them
      ansible.builtin.set_fact:
        _cfg: "{{ (_files.results[0].content | b64decode) | from_yaml }}"
        _policy: "{{ (_files.results[1].content | b64decode) | from_json }}"
        _compose: "{{ (_files.results[2].content | b64decode) | from_yaml }}"
        _traefik: "{{ (_files.results[3].content | b64decode) | from_yaml }}"
        _dynamic: "{{ (_files.results[4].content | b64decode) | from_yaml }}"

    - name: Headscale config carries the public URL WITH its port, and plain HTTP on loopback
      ansible.builtin.assert:
        that:
          - _cfg.server_url == 'https://hs.example.test:8443'
          - _cfg.listen_addr == '127.0.0.1:8080'
          - _cfg.metrics_listen_addr == '127.0.0.1:9095'
          - _cfg.tls_cert_path == ''
          - _cfg.prefixes.v4 == '100.64.0.0/16'

    - name: The embedded DERP is on and advertises the public IP
      ansible.builtin.assert:
        that:
          - _cfg.derp.server.enabled
          - _cfg.derp.server.ipv4 == '192.0.2.10'
          - _cfg.derp.server.stun_listen_addr == '0.0.0.0:3478'

    - name: Split DNS rendered as a mapping, without overriding the client's own resolver
      ansible.builtin.assert:
        that:
          - _cfg.dns.base_domain == 'ts.example.test'
          - "_cfg.dns.nameservers.split == {'example.test': ['192.0.2.2']}"
          - not _cfg.dns.override_local_dns
          - _cfg.policy.path == '/etc/headscale/policy.json'

    - name: The policy round-trips as JSON with its grants
      ansible.builtin.assert:
        that:
          - _policy.grants | length == 1
          - _policy.autoApprovers.exitNode == ['tag:router']

    - name: traefik listens on the public port, has no read timeout, and routes the one host
      ansible.builtin.assert:
        that:
          - _traefik.entryPoints.headscale.address == ':8443'
          - _traefik.entryPoints.headscale.transport.respondingTimeouts.readTimeout == '0s'
          - _traefik.certificatesResolvers.le.acme.dnsChallenge.provider == 'cloudflare'
          - "'hs.example.test' in _dynamic.http.routers.headscale.rule"
          - _dynamic.http.services.headscale.loadBalancer.servers[0].url == 'http://127.0.0.1:8080'

    - name: The credential is NOT in any rendered file
      ansible.builtin.assert:
        that:
          - _files.results | map(attribute='content') | map('b64decode') | select('search', 'TEST_TOKEN_NOT_REAL') | list | length == 0
        fail_msg: "The Cloudflare token was rendered into a world-readable file."
