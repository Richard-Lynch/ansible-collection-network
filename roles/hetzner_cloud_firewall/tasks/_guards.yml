---
# Safety guards. These run BEFORE any write, because this role changes the security boundary of a
# host reachable by exactly one path.
#
# Each condition is ONE LINE — a condition split across lines inside a YAML block scalar gets
# folded and stops meaning what it looks like it means.

- name: "GUARD — every required inbound port must be present in the declaration"
  # THE LOCKOUT GUARD. set_rules REPLACES the whole rule set, so omitting SSH removes it — and on a
  # host with one access path that is unrecoverable without the provider console. Checked against
  # the DECLARATION before the API is called, not after.
  vars:
    _declared_in_tcp: >-
      {{ hetzner_firewall_rules | selectattr('direction', 'eq', 'in')
         | selectattr('protocol', 'eq', 'tcp') | map(attribute='port') | map('string') | list }}
    _missing: >-
      {{ hetzner_firewall_required_ports | map('string')
         | reject('in', _declared_in_tcp) | list }}
  ansible.builtin.assert:
    that:
      - "_missing | length == 0"
    fail_msg: >-
      REFUSING TO PROCEED: the declared rule set omits required inbound TCP port(s) {{ _missing }}.
      set_rules REPLACES everything, so applying this would remove them — and port 22 is the only
      way into this host. Add them to hetzner_firewall_rules, or change
      hetzner_firewall_required_ports if they are genuinely no longer needed.
    success_msg: "All required inbound ports ({{ hetzner_firewall_required_ports }}) are declared."
    quiet: true

- name: "GUARD — every rule must carry a description"
  # A rule nobody can justify is a rule nobody dares remove: once nothing records why a port is
  # open, it stays open long after the service behind it is gone.
  ansible.builtin.assert:
    that:
      - "hetzner_firewall_rules | rejectattr('description', 'defined') | list | length == 0"
      - "hetzner_firewall_rules | selectattr('description', 'defined') | selectattr('description', 'eq', '') | list | length == 0"
    fail_msg: >-
      Every rule needs a non-empty `description` saying what it is for. Undescribed rules:
      {{ hetzner_firewall_rules | rejectattr('description', 'defined') | list }}
    success_msg: "Every rule carries a description."
    quiet: true

- name: "GUARD — directions and protocols must be valid"
  # A typo'd direction is silently accepted by neither the API nor a human reader, and a rule with
  # the wrong direction is a hole in the opposite side of the boundary from the one intended.
  ansible.builtin.assert:
    that:
      - "hetzner_firewall_rules | rejectattr('direction', 'in', ['in', 'out']) | list | length == 0"
      - "hetzner_firewall_rules | rejectattr('protocol', 'in', ['tcp', 'udp', 'icmp', 'esp', 'gre']) | list | length == 0"
    fail_msg: "Every rule needs direction in [in, out] and protocol in [tcp, udp, icmp, esp, gre]."
    success_msg: "Directions and protocols valid."
    quiet: true

- name: "GUARD — inbound rules must declare a source, outbound a destination"
  # An inbound rule with no source_ips is accepted by the API and matches NOTHING, so it reads as
  # protection that does not exist.
  ansible.builtin.assert:
    that:
      - "hetzner_firewall_rules | selectattr('direction', 'eq', 'in') | rejectattr('source_ips', 'defined') | list | length == 0"
      - "hetzner_firewall_rules | selectattr('direction', 'eq', 'out') | rejectattr('destination_ips', 'defined') | list | length == 0"
    fail_msg: >-
      Inbound rules need source_ips and outbound rules need destination_ips; without them the rule
      matches nothing and reads as protection that does not exist.
    success_msg: "Every rule declares its address scope."
    quiet: true
