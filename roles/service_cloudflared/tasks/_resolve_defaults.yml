  when: not (_service_cloudflared__argspec_resolved | default(false))

- name: Rebind the defaults on a repeat call, ignoring this role's own leftover facts
  ansible.builtin.set_fact:
    cloudflared_container_name: "{{ cloudflared_container_name__default if cloudflared_container_name__default is defined else cloudflared_container_name | default(omit) }}"
    cloudflared_image: "{{ cloudflared_image__default if cloudflared_image__default is defined else cloudflared_image | default(omit) }}"
