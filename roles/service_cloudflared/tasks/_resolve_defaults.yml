- name: Resolve declared options over their generated defaults
  ansible.builtin.set_fact:
    cloudflared_container_name: "{{ cloudflared_container_name | default(cloudflared_container_name__default) if cloudflared_container_name__default is defined else cloudflared_container_name | default(omit) }}"
