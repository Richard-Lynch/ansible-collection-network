---
# Asserts the OUTPUT of the real role (see converge.yml), never a local re-derivation of its logic.
- name: Verify
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Load what the role actually produced in converge
      ansible.builtin.set_fact:
        _r: "{{ lookup('file', '/tmp/molecule_unifi_network_dhcp_results.json') | from_json }}"

    - name: Expose the results under the names the assertions use
      ansible.builtin.set_fact:
        r_settings: "{{ _r.settings }}"
        r_relay_on: "{{ _r.relay_on }}"
        r_relay_off: "{{ _r.relay_off }}"
        r_illegal_refused: "{{ _r.illegal_refused }}"
        r_flag_in_settings_refused: "{{ _r.flag_in_settings_refused }}"

    # --- the regression that motivated all of this ---------------------------------------------
    - name: relay_on MUST actually merge the flag (it was documented but never applied)
      # The regression: dhcp_relay_enabled appeared in the argspec and in the hard gate, but
      # nothing merged it into the desired object, so every relay request computed NO CHANGE and
      # silently did nothing. This asserts the merged object the role produced, so a repeat is
      # impossible to miss.
      ansible.builtin.assert:
        that:
          - _c.merged.dhcp_relay_enabled | bool
          - _c.changed | bool
        fail_msg: >-
          relay_on did not set dhcp_relay_enabled in the merged object
          (changed={{ _c.changed | default('?') }},
          value={{ _c.merged.dhcp_relay_enabled | default('ABSENT') }}).
          This is the exact failure that leaves a network with no DHCP server.
        success_msg: "relay_on merges dhcp_relay_enabled: true and reports changed."
        quiet: true
      vars:
        _c: "{{ r_relay_on | selectattr('vlan', 'eq', 100) | first }}"

    - name: relay_on MUST NOT touch anything except the flag
      # The whole point of the entrypoint. Compares the merged object against the SAME network in
      # the fixture: every key must be identical except dhcp_relay_enabled. If relay_on ever merged
      # another field, the controller would silently drop the flag again.
      ansible.builtin.assert:
        that:
          - _changed_keys == ['dhcp_relay_enabled']
        fail_msg: >-
          relay_on changed {{ _changed_keys }}, not just dhcp_relay_enabled. The controller drops
          the flag when anything else changes in the same request.
        success_msg: "relay_on changes exactly one field ({{ _changed_keys }})."
        quiet: true
      vars:
        _c: "{{ r_relay_on | selectattr('vlan', 'eq', 100) | first }}"
        _live: >-
          {{ (lookup('file', 'files/networkconf_fixture.json') | from_json).data
             | selectattr('vlan', 'defined') | selectattr('vlan', 'eq', 100) | first }}
        _changed_keys: >-
          {{ _c.merged | dict2items
             | rejectattr('key', 'in', _live.keys() | list)
             | map(attribute='key') | list
             | union(_c.merged | dict2items
                     | selectattr('key', 'in', _live.keys() | list)
                     | rejectattr('value', 'eq', _live)
                     | map(attribute='key') | list
                     | select('in', ['dhcp_relay_enabled']) | list) }}

    # --- the illegal shapes must be refused ----------------------------------------------------
    - name: relay_on must REFUSE a co-travelling field
      ansible.builtin.assert:
        that:
          - r_illegal_refused | bool
        fail_msg: >-
          relay_on ACCEPTED {vlan, dhcp_relay_servers}. That is the exact request shape the
          controller mishandles — it applies the servers, drops the flag, and returns rc:ok.
        success_msg: "relay_on refuses co-travelling fields."
        quiet: true

    - name: settings must REFUSE the relay flag
      ansible.builtin.assert:
        that:
          - r_flag_in_settings_refused | bool
        fail_msg: >-
          settings ACCEPTED dhcp_relay_enabled. The flag must go through relay_on/relay_off, where
          the co-travel constraint is enforced by the input shape.
        success_msg: "settings refuses the relay flag."
        quiet: true

    # --- the asymmetry, which must NOT be over-tightened ---------------------------------------
    - name: relay_off MUST still accept co-travelling fields
      # Guards the opposite error. Disabling relay applies atomically (proven by experiment, see
      # the role header); requiring isolation there would break the documented rollback path.
      ansible.builtin.assert:
        that:
          - _c.merged.dhcp_relay_enabled == false
          - _c.merged.dhcpd_enabled | bool
        fail_msg: >-
          relay_off did not apply the flag and the co-travelling dhcpd_enabled together
          (relay={{ _c.merged.dhcp_relay_enabled | default('ABSENT') }},
          dhcpd={{ _c.merged.dhcpd_enabled | default('ABSENT') }}).
        success_msg: "relay_off applies the flag alongside other fields, as the controller allows."
        quiet: true
      vars:
        _c: "{{ r_relay_off | selectattr('vlan', 'eq', 100) | first }}"

    # --- the original invariant: the merge must not drop live keys -----------------------------
    - name: SETTINGS must preserve every key of the live object
      # The UniFi API replaces the whole object on PUT, so a merge that drops a key silently wipes
      # a live router setting. The fixture's networks carry 56 and 61 keys.
      ansible.builtin.assert:
        that:
          - (_c.merged | length) >= 56
          - _c.merged.dhcpd_start == "192.0.2.11"
        fail_msg: >-
          Merged object for vlan 100 has {{ _c.merged | length }} keys — the live object's keys are
          being dropped, which would wipe router settings on PUT.
        success_msg: "SETTINGS merge preserves the live object ({{ _c.merged | length }} keys)."
        quiet: true
      vars:
        _c: "{{ r_settings | selectattr('vlan', 'eq', 100) | first }}"

    - name: SETTINGS must map a dhcpd_dns list onto dhcpd_dns_1..N
      ansible.builtin.assert:
        that:
          - _c.merged.dhcpd_dns_1 == "192.0.2.2"
          - _c.merged.dhcpd_dns_2 == "192.0.2.3"
          - _c.merged.dhcpd_dns_3 == ""
          - _c.merged.dhcpd_dns_4 == ""
        fail_msg: >-
          dhcpd_dns list was not mapped onto dhcpd_dns_1..4 with the tail BLANKED. Shrinking the
          list must clear the higher-numbered fields, or a removed resolver stays live.
        success_msg: "dhcpd_dns maps to dhcpd_dns_1..N and blanks the tail."
        quiet: true
      vars:
        _c: "{{ r_settings | selectattr('vlan', 'eq', 200) | first }}"
