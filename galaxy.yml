---
namespace: richard_lynch
name: network
version: 1.1.1
readme: README.md
authors:
  - Richard Lynch
description: >-
  Network service roles: BIND 9 authoritative and recursive DNS with dynamic updates, Kea DHCP with per-host reservations, DNS service registration, Pi-hole, Headscale and Tailscale, WireGuard peers, UniFi networks, DHCP options and WLANs through the controller API, a multi-VLAN probe, and the edge: Traefik, Cloudflare Tunnel and Access (mTLS, wildcard hosting), published endpoints, an frp relay and the Hetzner Cloud firewall.
license:
  - GPL-3.0-or-later
tags:
  - networking
  - dns
  - dhcp
  - proxy
  - cloudflare
  - infrastructure
  - linux
dependencies:
  ansible.posix: ">=2.0.0"
  ansible.utils: ">=5.0.0"
  community.docker: ">=4.0.0"
  community.general: ">=10.0.0"
  richard_lynch.common: ">=1.0.0,<2.0.0"
repository: https://github.com/Richard-Lynch/ansible-collection-network
documentation: https://github.com/Richard-Lynch/ansible-collection-network/blob/main/README.md
homepage: https://github.com/Richard-Lynch/ansible-collection-network
issues: https://github.com/Richard-Lynch/ansible-collection-network/issues
build_ignore:
  - .ansible-lint
  - ci
  - configured_roles.txt
  - roles/*/defaults/SKIP
  - .github
  - .gitignore
  - collections.galaxy
  - devkit.toml
  - dist
  - export.manifest
  - tests/output
  - roles/*/meta/argument_specs.py
  - roles/*/molecule
  - "*.tar.gz"
